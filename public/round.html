<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Foodfinder</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<script src="/common.js"></script>
<script src="/round.js" defer></script>
</head>
<body>
<header class="top">
  <span class="brand">🍽️ <span data-i18n="app_name">Foodfinder</span></span>
  <div class="tools">
    <select id="lang" aria-label="Language"></select>
    <button id="theme" type="button" class="icon" data-i18n-aria="theme">◐</button>
  </div>
</header>
<main>
  <p id="v-loading" class="muted" data-i18n="loading"></p>

  <section id="v-error" hidden>
    <p class="big-emoji" aria-hidden="true">🙈</p>
    <p id="error-text" class="lead"></p>
  </section>

  <section id="v-join" hidden>
    <p class="big-emoji" aria-hidden="true">🍕🍜🍣</p>
    <h1 data-i18n="join_title"></h1>
    <p class="lead muted" data-i18n="join_text"></p>
    <form id="join-form" class="stack" autocomplete="off">
      <label><span class="lbl" data-i18n="pin"></span>
        <input id="pin" class="pin-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code">
      </label>
      <label><span class="lbl" data-i18n="name"></span>
        <input id="name" maxlength="30" required autocomplete="given-name">
      </label>
      <p id="join-error" class="error" role="alert"></p>
      <button type="submit" class="btn accent" data-i18n="join_btn"></button>
    </form>
  </section>

  <section id="v-start" class="screen" hidden>
    <p class="eyebrow" id="start-ey"></p>
    <h1 data-i18n="start_title"></h1>
    <input id="wish" class="wish" type="text" maxlength="40" autocomplete="off" data-i18n-ph="wish_ph" data-i18n-aria="sec_wish">
    <div class="quick" id="quick"></div>
    <div class="btns">
      <button id="wish-go" type="button" class="btn" disabled data-i18n="wish_go"></button>
      <button id="help-me" type="button" class="btn accent" data-i18n="help_me"></button>
    </div>
  </section>

  <section id="v-duel" class="duel" hidden>
    <div class="d-stage" id="d-stage"></div>
    <div class="d-head gutter">
      <div class="segs" id="segs"></div>
      <div class="mini" id="mini"></div>
    </div>
  </section>

  <section id="v-over" hidden></section>

  <section id="v-wait" hidden>
    <p class="eyebrow" data-i18n="wait_eyebrow"></p>
    <h1 data-i18n="wait_title"></h1>
    <p class="lead muted" id="wait-text"></p>
    <ul class="people" id="people"></ul>
    <p id="share-hint" class="muted small" role="status" hidden></p>
    <div class="btns">
      <button id="skip" type="button" class="btn ghost" data-i18n="skip_btn" hidden></button>
      <button id="change" type="button" class="link" data-i18n="change_vote" hidden></button>
    </div>
  </section>

  <section id="v-flash" class="flash" hidden>
    <strong data-i18n="match_flash"></strong>
    <span data-i18n="match_sub"></span>
  </section>

  <section id="v-result" hidden>
    <p class="eyebrow" data-i18n="res_eyebrow"></p>
    <div class="pwords" id="pwords"></div>
    <p class="wishline" id="r-wishes" hidden></p>
    <p class="wishline" id="r-nogo" hidden></p>
    <div class="panel">
      <h2 data-i18n="ai_title"></h2>
      <p class="muted" data-i18n="ai_text"></p>
      <div class="seg" id="providers" role="group"></div>
      <div class="row">
        <button id="copy-prompt" type="button" class="btn accent" data-i18n="copy_prompt"></button>
        <button id="send-ai" type="button" class="btn ghost" disabled></button>
      </div>
      <p class="muted small" data-i18n="ai_soon"></p>
      <details class="fold">
        <summary data-i18n="show_prompt"></summary>
        <pre id="prompt" class="md"></pre>
      </details>
    </div>
  </section>
</main>
</body>
</html>
