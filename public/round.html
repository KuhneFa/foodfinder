<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Foodfinder</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<script src="/common.js"></script>
<script src="/round.js" defer></script>
</head>
<body>
<header class="top">
  <span class="brand">🍽️ <span data-i18n="app_name">Foodfinder</span></span>
  <div class="tools">
    <select id="lang" aria-label="Language"></select>
    <button id="theme" type="button" class="icon" data-i18n-aria="theme">◐</button>
  </div>
</header>
<main>
  <p id="v-loading" class="muted" data-i18n="loading"></p>

  <section id="v-error" hidden>
    <p class="big-emoji" aria-hidden="true">🙈</p>
    <p id="error-text" class="lead"></p>
  </section>

  <section id="v-join" hidden>
    <p class="big-emoji" aria-hidden="true">🍕🍜🍣</p>
    <h1 data-i18n="join_title"></h1>
    <p class="lead muted" data-i18n="join_text"></p>
    <form id="join-form" class="stack" autocomplete="off">
      <label><span class="lbl" data-i18n="pin"></span>
        <input id="pin" class="pin-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code">
      </label>
      <label><span class="lbl" data-i18n="name"></span>
        <input id="name" maxlength="30" required autocomplete="given-name">
      </label>
      <p id="join-error" class="error" role="alert"></p>
      <button type="submit" class="primary" data-i18n="join_btn"></button>
    </form>
  </section>

  <section id="v-swipe" class="swipe" hidden>
    <div class="swipe-top">
      <span id="swipe-label" class="eyebrow"></span>
      <span id="swipe-progress" class="progress"></span>
    </div>
    <div id="deck" class="deck"></div>
    <p class="hint muted" data-i18n="swipe_hint"></p>
    <div class="swipe-actions">
      <button id="btn-undo" type="button" class="round-btn small" data-i18n-aria="undo">↶</button>
      <button id="btn-no" type="button" class="round-btn no" data-i18n-aria="swipe_no">✕</button>
      <button id="btn-yes" type="button" class="round-btn yes" data-i18n-aria="swipe_yes">♥</button>
    </div>
  </section>

  <section id="v-summary" hidden>
    <h1 data-i18n="summary_title"></h1>
    <p class="muted" data-i18n="summary_yes"></p>
    <div id="yes-chips" class="chips"></div>
    <form id="idea-form" class="field">
      <label for="idea-input" class="lbl" data-i18n="idea_label"></label>
      <div class="row">
        <input id="idea-input" maxlength="40" data-i18n-ph="idea_ph">
        <button type="submit" data-i18n="add"></button>
      </div>
    </form>
    <div class="field">
      <label for="note" class="lbl" data-i18n="note_label"></label>
      <textarea id="note" maxlength="300" rows="2" data-i18n-ph="note_ph"></textarea>
    </div>
    <p id="summary-error" class="error" role="alert"></p>
    <div class="row">
      <button id="summary-undo" type="button" data-i18n="undo"></button>
      <button id="submit-swipes" type="button" class="primary grow" data-i18n="submit"></button>
    </div>
  </section>

  <section id="v-wait" hidden>
    <p class="big-emoji"><span class="pulse" aria-hidden="true">⏳</span></p>
    <h1 data-i18n="wait_title"></h1>
    <p id="wait-text" class="lead muted"></p>
    <p id="wait-excluded" class="note-box" data-i18n="err_excluded" hidden></p>
    <ul id="people" class="people"></ul>
    <button id="skip" type="button" class="wide" data-i18n="skip_btn" hidden></button>
  </section>

  <section id="v-nomatch" hidden>
    <h1 data-i18n="nomatch_title"></h1>
    <p class="lead" data-i18n="nomatch_text"></p>
    <div id="close-wrap" hidden>
      <p class="muted" data-i18n="nomatch_close"></p>
      <div id="close-chips" class="chips"></div>
    </div>
    <button id="again" type="button" class="primary wide" data-i18n="again_btn"></button>
  </section>

  <section id="v-rank" hidden>
    <h1 class="accent-text" data-i18n="match_title"></h1>
    <p class="lead" data-i18n="match_text"></p>
    <ol id="rank-list" class="rank"></ol>
    <p class="muted small" data-i18n="veto_hint"></p>
    <p id="rank-error" class="error" role="alert"></p>
    <button id="submit-rank" type="button" class="primary wide" data-i18n="submit"></button>
  </section>

  <section id="v-result" hidden>
    <p class="kicker" data-i18n="result_title"></p>
    <div id="winner" class="result-card"></div>
    <p id="result-note" class="center muted"></p>
    <ul id="plans" class="plans"></ul>

    <div class="panel">
      <h2 data-i18n="ai_title"></h2>
      <p class="muted" data-i18n="ai_text"></p>
      <div class="field">
        <label for="place" class="lbl" data-i18n="location_label"></label>
        <input id="place" maxlength="80" data-i18n-ph="location_ph" autocomplete="address-level2">
      </div>
      <button id="copy-prompt" type="button" class="primary wide" data-i18n="copy_prompt"></button>
      <details class="fold">
        <summary data-i18n="show_prompt"></summary>
        <pre id="md" class="md"></pre>
        <button id="dl-md" type="button" class="link" data-i18n="download"></button>
      </details>
    </div>

    <details id="details-wrap" class="fold">
      <summary data-i18n="details"></summary>
      <ul id="details" class="plain"></ul>
      <div id="notes-wrap" hidden>
        <h3 data-i18n="notes"></h3>
        <ul id="notes" class="plain"></ul>
      </div>
    </details>
  </section>
</main>
</body>
</html>
